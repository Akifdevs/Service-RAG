<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatbot Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>


<!-- ================= LAUNCHER BUTTON ================= -->
<button class="launcher" id="launcher" aria-label="Open chat">
  <span class="launch-badge" id="launchBadge"></span>
  <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
    <path d="M18 6 6 18M6 6l12 12"/>
  </svg>
</button>

<!-- ================= CHAT PANEL ================= -->
<div class="panel" id="panel">

  <div class="panel-header">
    <div class="bot-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6247dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="16" height="12" rx="3"/>
        <path d="M12 8V4"/>
        <circle cx="12" cy="3" r="1.2" fill="#6247dd" stroke="none"/>
        <circle cx="9" cy="14" r="1.4" fill="#6247dd" stroke="none"/>
        <circle cx="15" cy="14" r="1.4" fill="#6247dd" stroke="none"/>
        <path d="M2 12h2M20 12h2"/>
      </svg>
    </div>
    <div class="header-title">
      <div class="name">Chatbot</div>
      <div class="sub"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
    </div>
    <button class="header-btn" id="settingsBtn" aria-label="Connection settings" title="Connection settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="header-btn chevron-btn" id="collapseBtn" aria-label="Collapse">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
  </div>

  <div class="settings-sheet" id="settingsSheet">
    <div class="settings-row">
      <div>
        <label for="baseUrlInput">API base URL</label>
        <input id="baseUrlInput" type="text" placeholder="http://localhost:8000" />
      </div>
      <div>
        <label for="prefixInput">Prefix</label>
        <input id="prefixInput" type="text" placeholder="/api" />
      </div>
    </div>
    <div class="hint">Calls go to <code id="endpointPreview">–</code>. If the status dot stays red, check <code>ALLOWED_ORIGINS</code> on the server.</div>
  </div>

  <div class="panel-body" id="panelBody">
    <div class="empty-state" id="emptyState">
      Hi! Ask me anything about the documentation and I'll do my best to help.
    </div>
  </div>

  <div class="panel-footer">
    <div class="composer">
      <input id="questionInput" type="text" placeholder="Message…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
